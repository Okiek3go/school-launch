<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>School Launch</title>
<style>
:root { --bg:#101827; --panel:#182338; --text:#f7f9fc; --muted:#aebbd0; --accent:#79d7ff; --done:#94e6ad; }
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(circle at top,#1c3152 0,#101827 55%); color:var(--text);
  display:flex; justify-content:center;
}
main { width:min(920px,100%); padding:34px 24px 60px; text-align:center; }
.rocket { font-size:54px; }
h1 { margin:4px 0 0; letter-spacing:.08em; font-size:clamp(28px,5vw,48px); }
.clock { font-variant-numeric:tabular-nums; font-weight:800; font-size:clamp(54px,12vw,108px); margin:8px 0 4px; }
.seconds { color:var(--accent); }
.sub { color:var(--muted); margin-bottom:22px; }
.banner {
  display:none; margin:18px auto; padding:18px; border:2px solid var(--accent);
  border-radius:18px; font-size:clamp(22px,4vw,34px); font-weight:800; background:#12243a;
}
.tasks { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px; margin:24px auto; max-width:760px; }
.task {
  appearance:none; border:2px solid #35445e; background:var(--panel); color:var(--text);
  border-radius:18px; padding:20px 14px; font-size:clamp(19px,3vw,27px); font-weight:750;
  text-align:left; cursor:pointer; min-height:76px;
}
.task::before { content:"☐"; display:inline-block; width:38px; color:var(--accent); }
.task.done { border-color:#4b8061; color:#ccefd6; opacity:.78; }
.task.done::before { content:"✓"; color:var(--done); }
.progress { font-size:20px; color:var(--muted); font-weight:700; }
.controls { margin-top:25px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.control {
  border:1px solid #4b5d79; border-radius:12px; padding:12px 16px; background:#202d43; color:white;
  font-weight:700; font-size:16px;
}
#launch { display:none; font-size:clamp(48px,11vw,100px); font-weight:900; margin-top:34px; }
#soundnote { font-size:14px; color:var(--muted); margin-top:16px; }
@media(max-width:620px){ .tasks{grid-template-columns:1fr;} main{padding-top:22px;} }
</style>
</head>
<body>
<main>
  <div class="rocket">🚀</div>
  <h1>SCHOOL LAUNCH</h1>
  <div id="clock" class="clock">60:<span class="seconds">00</span></div>
  <div class="sub">Countdown to 08:00</div>

  <div id="banner" class="banner">🔔 10 MINUTES TO LAUNCH</div>

  <section id="tasks" class="tasks" aria-label="Morning tasks">
    <button class="task">BREAKFAST</button>
    <button class="task">TOILET</button>
    <button class="task">TEETH</button>
    <button class="task">HAIR</button>
    <button class="task">GET DRESSED</button>
    <button class="task">BAG CHECK</button>
  </section>
  <div id="progress" class="progress">0 / 6 COMPLETE</div>

  <div id="launch">🚀 LAUNCH!</div>

  <div class="controls">
    <button id="enable" class="control">🔊 ENABLE SOUND</button>
    <button id="reset" class="control">↻ RESET TASKS</button>
    <button id="demo" class="control">▶ DEMO SOUNDS</button>
  </div>
  <div id="soundnote">On iPad, tap ENABLE SOUND once after opening the page. Keep the page open for timed sounds.</div>
</main>

<script>
const tasks=[...document.querySelectorAll('.task')];
const progress=document.getElementById('progress');
const banner=document.getElementById('banner');
const launch=document.getElementById('launch');
const taskBox=document.getElementById('tasks');
const clock=document.getElementById('clock');

let audioCtx=null, musicTimer=null, musicStarted=false;
let fired={seven:false, ten:false, five:false, launch:false};

function audio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq,dur=.12,delay=0,type='sine',gain=.09){
  const c=audio(), o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.value=freq; g.gain.value=gain;
  o.connect(g); g.connect(c.destination);
  const t=c.currentTime+delay; o.start(t); o.stop(t+dur);
}
function doneSound(){ tone(660,.10); tone(880,.16,.11); }
function schoolBell(){
  [0,0.24,0.55].forEach((d,i)=>{ tone(i===2?880:740,.18,d,'triangle',.12); tone(i===2?1320:1110,.22,d,'sine',.04); });
}
function alarm(){
  for(let i=0;i<6;i++) tone(i%2?880:660,.18,i*.24,'square',.055);
}
function startDeparture(){
  if(musicStarted) return; musicStarted=true;
  const seq=[392,494,587,659,587,740,659,784];
  let i=0;
  musicTimer=setInterval(()=>{
    tone(seq[i%seq.length],.23,0,'triangle',.055);
    if(i%4===0) tone(seq[i%seq.length]/2,.35,0,'sine',.035);
    i++;
  },430);
}
function stopDeparture(){ if(musicTimer) clearInterval(musicTimer); musicTimer=null; musicStarted=false; }
function launchSound(){ stopDeparture(); [392,523,659,784,1047].forEach((f,i)=>tone(f,.3,i*.11,'triangle',.08)); }

tasks.forEach(btn=>btn.addEventListener('click',()=>{
  const becomingDone=!btn.classList.contains('done');
  btn.classList.toggle('done');
  if(becomingDone) doneSound();
  updateProgress();
}));
function updateProgress(){
  const n=tasks.filter(x=>x.classList.contains('done')).length;
  progress.textContent=`${n} / 6 COMPLETE` + (n===6 ? '  ✓ READY' : '');
}
document.getElementById('enable').onclick=()=>{ audio(); doneSound(); document.getElementById('enable').textContent='✓ SOUND ON'; };
document.getElementById('reset').onclick=()=>{
  tasks.forEach(x=>x.classList.remove('done')); updateProgress(); banner.style.display='none';
  launch.style.display='none'; taskBox.style.display='grid'; progress.style.display='block';
  fired={seven:false,ten:false,five:false,launch:false}; stopDeparture();
};
document.getElementById('demo').onclick=()=>{
  audio(); schoolBell(); setTimeout(()=>{startDeparture(); setTimeout(()=>{launchSound();},4000)},1300);
};

function tick(){
  const now=new Date(), h=now.getHours(), m=now.getMinutes(), s=now.getSeconds();
  // Countdown is anchored to 08:00 local time. Before 07:00 it shows 60:00.
  let target=new Date(now); target.setHours(8,0,0,0);
  let diff=Math.max(0,Math.floor((target-now)/1000));
  if(h<7) diff=3600;
  if(h>=7 && h<8) document.querySelector('.sub').textContent='Countdown to 08:00';
  else document.querySelector('.sub').textContent='TEST MODE • Live countdown runs 07:00–08:00';
  const mm=Math.floor(diff/60), ss=diff%60;
  clock.innerHTML=`${String(mm).padStart(2,'0')}:<span class="seconds">${String(ss).padStart(2,'0')}</span>`;

  if(h===7 && m===0 && !fired.seven){ fired.seven=true; alarm(); }
  if(h===7 && m>=50 && m<55){ banner.style.display='block'; }
  if(h===7 && m===50 && !fired.ten){ fired.ten=true; schoolBell(); }
  if(h===7 && m>=55 && !fired.five){ fired.five=true; startDeparture(); }
  if(h>=8){
    // Keep the task list visible after 08:00 so the family can test it during the day.
    clock.innerHTML='60:<span class="seconds">00</span>';
    banner.style.display='none';
    taskBox.style.display='grid';
    progress.style.display='block';
    launch.style.display='none';
  }
}
setInterval(tick,250); tick();
</script>
</body>
</html>
