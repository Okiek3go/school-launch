<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>School Launch</title>
<style>
:root{--bg:#0c1526;--panel:#17243b;--text:#f7f9fc;--muted:#aebbd0;--accent:#77d6ff;--done:#8ce2a8}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at top,#20395e 0,#0c1526 58%);display:flex;justify-content:center}main{width:min(900px,100%);padding:24px 22px 52px;text-align:center}.rocket{font-size:48px}h1{margin:3px 0;letter-spacing:.08em;font-size:clamp(27px,5vw,46px)}.clock{font-variant-numeric:tabular-nums;font-weight:900;font-size:clamp(58px,13vw,108px);line-height:1;margin:12px 0 4px}.sec{color:var(--accent)}.sub{color:var(--muted);font-weight:650}.prompt{margin:18px auto 4px;font-weight:850;font-size:clamp(19px,3vw,25px)}.banner{display:none;margin:18px auto;padding:17px;border:2px solid var(--accent);border-radius:18px;background:#112640;font-size:clamp(22px,4vw,34px);font-weight:900}.tasks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px auto;max-width:760px}.task{border:2px solid #354762;background:var(--panel);color:var(--text);border-radius:18px;padding:19px 14px;min-height:72px;font-size:clamp(19px,3vw,26px);font-weight:800;text-align:left}.task:before{content:"☐";display:inline-block;width:38px;color:var(--accent)}.task.done{border-color:#4a7f5d;color:#ccefd6;opacity:.72}.task.done:before{content:"✓";color:var(--done)}.progress{font-size:20px;color:var(--muted);font-weight:800}.toast{height:36px;margin-top:8px;font-size:24px;font-weight:900;color:var(--accent);opacity:0;transition:.18s}.toast.show{opacity:1}.complete{display:none;margin:24px auto 8px;max-width:700px;padding:28px 18px;border:2px solid #506787;border-radius:26px;background:#142238}.complete .art{font-size:clamp(78px,17vw,145px)}.complete h2{font-size:clamp(30px,6vw,50px);margin:12px 0 4px}.spare{font-size:clamp(20px,4vw,30px);color:var(--accent);font-weight:850}.controls{margin-top:24px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.control{border:1px solid #4b5d79;border-radius:12px;padding:11px 15px;background:#202d43;color:#fff;font-weight:750;font-size:15px}.note{font-size:13px;color:var(--muted);margin-top:13px}.launch{display:none;font-size:clamp(48px,11vw,100px);font-weight:950;margin-top:32px}@media(max-width:620px){.tasks{grid-template-columns:1fr}}
</style></head><body><main>
<div class="rocket">🚀</div><h1>SCHOOL LAUNCH</h1><div id="clock" class="clock">60:<span class="sec">00</span></div><div id="sub" class="sub"></div><div id="banner" class="banner"></div><div id="prompt" class="prompt">🎯 PICK ONE. ANY ONE.</div>
<section id="tasks" class="tasks"><button class="task">BREAKFAST</button><button class="task">TOILET</button><button class="task">TEETH</button><button class="task">HAIR</button><button class="task">GET DRESSED</button><button class="task">BAG CHECK</button></section>
<div id="progress" class="progress">0 / 6 COMPLETE</div><div id="toast" class="toast"></div>
<section id="complete" class="complete"><div id="art" class="art">🪐</div><h2>MISSION COMPLETE ✓</h2><div>READY FOR LAUNCH</div><div id="spare" class="spare"></div></section><div id="launch" class="launch">🚀 LAUNCH!</div>
<div class="controls"><button id="sound" class="control">🔊 ENABLE SOUND</button><button id="reset" class="control">↻ RESET</button><button id="demo" class="control">▶ DEMO</button></div><div class="note">On iPad, tap ENABLE SOUND once. Keep this page open for timed sounds.</div>
<script>
const tasks=[...document.querySelectorAll('.task')],progress=document.getElementById('progress'),prompt=document.getElementById('prompt'),toast=document.getElementById('toast'),complete=document.getElementById('complete'),art=document.getElementById('art'),spare=document.getElementById('spare'),banner=document.getElementById('banner'),clock=document.getElementById('clock'),sub=document.getElementById('sub'),launch=document.getElementById('launch');let ctx=null,musicTimer=null,musicStarted=false,firstStarted=false,completeShown=false;let fired={ten:false,five:false,launch:false};const arts=['🚀✨','🪐🚀','👨‍🚀🌟','🤖🚀','🦖🌌','🐈‍⬛🚀','🌎🛰️','👾✨','🌙🚀','🛸⭐'];
function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(f,d=.12,delay=0,type='sine',gain=.075){const c=audio(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.value=gain;o.connect(g);g.connect(c.destination);const t=c.currentTime+delay;o.start(t);o.stop(t+d)}function ping(){tone(660,.09);tone(880,.15,.10)}function bell(){[0,.24,.55].forEach((d,i)=>{tone(i===2?880:740,.18,d,'triangle',.11);tone(i===2?1320:1110,.2,d,'sine',.035)})}function startMusic(){if(musicStarted)return;musicStarted=true;const seq=[392,494,587,659,587,740,659,784];let i=0;musicTimer=setInterval(()=>{tone(seq[i%8],.23,0,'triangle',.05);if(i%4===0)tone(seq[i%8]/2,.35,0,'sine',.03);i++},430)}function stopMusic(){if(musicTimer)clearInterval(musicTimer);musicTimer=null;musicStarted=false}function launchSound(){stopMusic();[392,523,659,784,1047].forEach((f,i)=>tone(f,.3,i*.11,'triangle',.075))}function flash(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1100)}function secondsToEight(){const n=new Date(),t=new Date(n);t.setHours(8,0,0,0);return Math.max(0,Math.floor((t-n)/1000))}function fmt(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')} TO SPARE`}
function update(){const n=tasks.filter(x=>x.classList.contains('done')).length,left=6-n;progress.textContent=`${n} / 6 COMPLETE`;if(n===0)prompt.textContent='🎯 PICK ONE. ANY ONE.';else if(left>1)prompt.textContent=`🚀 ${left} TO GO`;else if(left===1)prompt.textContent='🚀 ONE MORE!';if(n===6&&!completeShown){completeShown=true;art.textContent=arts[Math.floor(Math.random()*arts.length)];complete.style.display='block';document.getElementById('tasks').style.display='none';prompt.style.display='none';progress.style.display='none';spare.textContent=fmt(secondsToEight());[523,659,784,1047].forEach((f,i)=>tone(f,.18,i*.1,'triangle',.07))}}
tasks.forEach(b=>b.onclick=()=>{const add=!b.classList.contains('done');b.classList.toggle('done');if(add){ping();if(!firstStarted){firstStarted=true;flash("🚀 WE'RE MOVING!")}else flash('✓ NICE!')}update()});
function tick(){const n=new Date(),h=n.getHours(),m=n.getMinutes();let diff=secondsToEight(),live=h===7;if(!live)diff=3600;clock.innerHTML=`${String(Math.floor(diff/60)).padStart(2,'0')}:<span class="sec">${String(diff%60).padStart(2,'0')}</span>`;sub.textContent=live?'Countdown to 08:00':'TEST MODE • Live countdown runs 07:00–08:00';if(completeShown&&live)spare.textContent=fmt(diff);if(live&&m>=40&&m<50&&!completeShown)prompt.textContent="🚀 LET'S GET MOVING";if(live&&m>=50){banner.style.display='block';banner.textContent=m>=55?'🚀 FINAL FIVE!':'🔔 10 MINUTES TO LAUNCH'}else banner.style.display='none';if(live&&m===50&&!fired.ten){fired.ten=true;bell()}if(live&&m>=55&&!fired.five){fired.five=true;startMusic()}if(h===8&&m===0&&!fired.launch){fired.launch=true;launchSound();launch.style.display='block';banner.style.display='none'}}
setInterval(tick,250);tick();document.getElementById('sound').onclick=()=>{audio();ping();document.getElementById('sound').textContent='✓ SOUND ON'};document.getElementById('reset').onclick=()=>{tasks.forEach(x=>x.classList.remove('done'));document.getElementById('tasks').style.display='grid';prompt.style.display='block';progress.style.display='block';complete.style.display='none';launch.style.display='none';firstStarted=false;completeShown=false;fired={ten:false,five:false,launch:false};stopMusic();update();tick()};document.getElementById('demo').onclick=()=>{audio();banner.style.display='block';banner.textContent='🔔 10 MINUTES TO LAUNCH';bell();setTimeout(()=>{banner.textContent='🚀 FINAL FIVE!';startMusic();setTimeout(()=>{launchSound();banner.style.display='none';launch.style.display='block'},4000)},1200)};
</script></main></body></html>
